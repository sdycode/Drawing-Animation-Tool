<!DOCTYPE html>
<html>
<head>
  <!--
    Driven by the `--base-href` build argument, never hard-coded.
    The legacy app pinned this to "/Annimation/" for GitHub Pages, which made
    the build undeployable anywhere else (docs/v3/07).
      Firebase Hosting: flutter build web --base-href /
      Project subpath:  flutter build web --base-href /some-path/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A browser-based vector animation editor for animated icons and micro-interactions.">
  <!-- No <meta name="viewport"> here on purpose: Flutter Web installs its own
       and logs a replacement warning on every run if one is already present. -->

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Drawing Animation Tool</title>
</head>
<body>
  <!-- Flutter 3.44 bootstrap. Replaces the pre-3.22 _flutter.loader.loadEntrypoint flow. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
