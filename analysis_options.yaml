# Static-analysis configuration. Run with `flutter analyze`.
# Baseline: package:flutter_lints. A stricter set (very_good_analysis /
# strict-casts) is a tracked Phase-0 task — it needs the existing warning
# backlog triaged first (see docs/plan_of_action.md), so it is NOT enabled yet.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"        # generated (e.g. Animated/.../play_pause.g.dart)
    - "**/*.freezed.dart"  # generated (future)

linter:
  rules:
    # Curated additions land here as the codebase is cleaned up.
    # Full very_good_analysis adoption is tracked in docs/plan_of_action.md.
