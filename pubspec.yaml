name: drawing_animation_tool
description: >-
  A browser-based vector animation editor for animated icons and
  micro-interactions. Draw bezier shapes, keyframe their properties, scrub a
  timeline, export JSON. Flutter Web only.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"   # 3.3 is where extension types (NodeId, AnchorId) went stable

dependencies:
  flutter:
    sdk: flutter

  # Domain core and renderer. Arrows point inward: app -> anim_render ->
  # anim_core. anim_core depends on nothing (docs/v3/04 §1).
  anim_core:
    path: packages/anim_core
  anim_render:
    path: packages/anim_render

  # State: three separate Notifiers, not one god-object (docs/v3/04 §4).
  flutter_riverpod: ^2.5.1

  # Persistence. Reaches the domain only through ProjectStore (String in /
  # String out) so these types never cross into anim_core (docs/v3/04 §2).
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Theme preference only. localStorage on web. Behind ThemeStore so widget
  # tests never reach a platform binding (docs/v3/04 §2's seam habit, applied
  # to the one other thing that touches storage).
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # The 8 legacy projects. Golden fixtures for the one-way importer and the
    # round-trip CI gate (docs/v3/02 §8), not a supported migration path.
    - assets/library/
