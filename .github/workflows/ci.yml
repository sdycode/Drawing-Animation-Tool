name: CI

# v3 gate. Greenfield, so every check is a HARD gate from commit one — there is
# no legacy backlog to grandfather in, and the cost of adding a gate is lowest
# now.
#
# The two named CI gate tests from docs/v3/00 §5 (round-trip over the 8 fixtures,
# golden transform on the 450.2x250.4 artboard) land at M1 and run under
# `anim_core tests`. Do NOT add a third gate — see the docs/v3/06 M1 risk note.

on:
  push:
    branches: [v3, main]
  pull_request:
    branches: [v3, main]

jobs:
  build:
    name: analyze · test · boundaries · build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib packages tool

      - name: Analyze
        run: flutter analyze

      # anim_core is pure Dart: it tests without a Flutter toolchain, which is
      # the whole point of the package boundary (docs/v3/04 §1).
      - name: anim_core tests
        working-directory: packages/anim_core
        run: |
          dart pub get
          dart test

      - name: App tests
        run: flutter test

      # docs/v3/08 §3 — features must not import each other.
      - name: Architecture boundaries
        run: dart run tool/check_boundaries.dart

      - name: Build web
        run: flutter build web --base-href / --release
